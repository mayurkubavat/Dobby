[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Dobby"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for desktop GUI automation, screen perception, and window management on macOS and Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "pillow>=10.0.0",
    "pydantic>=2.10.0",
    "opencv-python-headless>=4.8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Linux X11 backend. Not imported unless the process is on Linux.
linux = [
    "mss>=10.2.0; sys_platform == 'linux'",
    "pynput>=1.8.2; sys_platform == 'linux'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]
# Windows input. UIA window enumeration is still a fail-closed stub.
windows = [
    "pynput>=1.8.2; sys_platform == 'win32'",
]
# Local OCR lane. Linux/Windows: PP-OCR ONNX models (bundled in the wheel up to Python 3.12).
ocr = [
    "rapidocr_onnxruntime>=1.3; sys_platform != 'darwin' and python_version < '3.13'",
    # rapidocr_onnxruntime has no wheels past 3.12; its successor downloads its models once.
    "rapidocr>=3.0; sys_platform != 'darwin' and python_version >= '3.13'",
    "onnxruntime>=1.20; sys_platform != 'darwin' and python_version >= '3.13'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
]
# macOS backend: Quartz capture/input, Accessibility tree, AppKit window activation
macos = [
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "onnxruntime>=1.17; sys_platform == 'darwin'",
]
# ADK agent pipeline (python -m dobby.adk): Gemma judges via LiteLLM -> Ollama
adk = [
    "google-adk>=2.13",
    "litellm>=1.80",
]
dev = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dobby = "dobby.cli:main"

[tool.setuptools.packages.find]
include = ["dobby*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "replay: replays recorded cassettes in tests/cassettes (pytest -m replay)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", "learnings", "references"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",
    "RUF",
    "D",        # pydocstyle (Google convention)
]
ignore = [
    "E501",     # line length is the formatter's job
    "D105",     # magic methods
    "D107",     # __init__: document the class instead
    "SIM105",   # contextlib.suppress is not clearer than try/except/pass
    "SIM102",   # nested ifs leave room for a comment on each condition
    "SIM108",   # ternaries are not always clearer
    "C408",     # dict(a=1) reads fine
    "B905",     # zip() over sequences of known equal length
    "RUF005",   # (*a, b) is not clearer than a + (b,)
    "RUF012",   # class-level constant tables are never mutated
    "RUF046",   # int(round(x)) is explicit on purpose
    "SIM115",   # lock and log files are held open on purpose
    "E731",     # small lambdas in tests and fakes
    "E741",     # `l` for a line or label in short comprehensions
    "RUF001", "RUF002", "RUF003",  # typographic quotes, dashes and arrows are intentional in UI text
]
# Codes from linters ruff does not run here; keep their noqa comments.
external = ["BLE001", "WPS433"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "B008", "B023", "SIM117"]
"scripts/**" = ["D"]
"examples/**" = ["D"]
"apps/**" = ["D"]
# Lambdas here are called on the spot inside the loop, so late binding is safe.
"dobby/perception/atspi.py" = ["B023"]
"dobby/hub/daemon.py" = ["B023"]
# Tool docstrings here are the MCP tool descriptions the model reads; keep
# their wording and layout as tuned rather than reshaping them for pydocstyle.
"dobby/server.py" = ["D205", "D417"]
