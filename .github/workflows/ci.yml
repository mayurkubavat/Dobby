name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.9"
      - name: Lint and docstrings
        run: ruff check --output-format=github .
      - name: Formatting
        run: ruff format --check .

  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -e ".[dev,linux]"
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install -e ".[dev,macos,ocr]"
      - name: Byte-compile
        run: python -m compileall -q pinlet
      - name: Tests
        # The suite never sends real mouse or keyboard input (PINLET_LIVE_DESKTOP_TESTS is unset).
        # Shared runners are slower than a developer machine: 3x the latency budgets.
        env:
          PINLET_PERF_SCALE: "3"
        run: python -m pytest -q

  app:
    name: Mac app (swift build)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Pinlet.app's sources
        working-directory: apps/macos
        run: swift build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - name: Known vulnerabilities in dependencies
        run: |
          python -m pip install -e ".[linux]"
          pip-audit --skip-editable
