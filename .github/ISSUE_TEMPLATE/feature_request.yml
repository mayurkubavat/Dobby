name: Feature request
description: An idea for something Dobby should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and where Dobby gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Mention any app (Vivado, Verdi, Chrome, ...) it is about.
  - type: textarea
    id: safety
    attributes:
      label: Anything risky?
      description: Would this let Dobby send, delete, pay or run commands? How should it ask first?
